[package]
name = "devcontainer-backend-doctor"
version = "0.1.0"
description = "Predict devcontainer and Compose compatibility across Mac container backends"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["devcontainer", "docker", "podman", "orbstack", "macos"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "devcontainer-backend-doctor"
path = "src/main.rs"

